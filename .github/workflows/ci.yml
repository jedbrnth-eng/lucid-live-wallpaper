name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR branch cancels the older run; main runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (macOS)
    runs-on: macos-15
    # A normal run takes 2-8 minutes. Without this, a hung test would hold the macOS runner for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift version
        run: swiftc --version
      - name: Build Lucid.app
        run: ./build.sh
      - name: Unit tests (Swift, offline)
        run: ./test.sh
      - name: Check the bundle
        run: |
          test -x build/Lucid.app/Contents/MacOS/Lucid
          plutil -lint build/Lucid.app/Contents/Info.plist
      - name: Catalog builder tests (offline)
        run: python3 -m unittest tools/test_build_catalog.py
      - name: Catalog is valid JSON
        run: python3 -c "import json; d=json.load(open('catalog.json')); print(len(d), 'catalog items')"
