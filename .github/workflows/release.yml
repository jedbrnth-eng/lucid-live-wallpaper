name: Release

# Publishes a GitHub release with Lucid.zip whenever VERSION changes on main
# (or when run by hand). The release tag is v<VERSION>.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          # Plain x.y.z only: the value becomes a tag, a title and part of shell commands below.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like 1.2.3, got: $v" >&2; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build Lucid.app
        if: steps.exists.outputs.found == 'false'
        run: ./build.sh
      - name: Package
        if: steps.exists.outputs.found == 'false'
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Lucid.app Lucid.zip
          # Checksum users and install.sh can verify the download against.
          shasum -a 256 Lucid.zip > Lucid.zip.sha256
          cat Lucid.zip.sha256
      - name: Publish release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Release notes = this version's CHANGELOG section + the install steps. Values reach the shell and awk
          # through the environment only (never pasted into the script text).
          H="## [${TAG#v}]" awk 'index($0, ENVIRON["H"]) == 1 {on = 1; print "## Changes in this version"; next} on && (/^## \[/ || /^\[[^]]+\]: /) {exit} on' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
          gh release create "$TAG" Lucid.zip Lucid.zip.sha256 \
            --title "Lucid $TAG" \
            --notes-file notes.md
